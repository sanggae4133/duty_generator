{% extends "duty/base.html" %}{% load static %}
{% block content %}
<article style="max-width: 24rem; margin: auto">
  <img src="{% static 'duty/nextrade-logo.svg' %}" alt="NEXTRADE" class="login-logo">
  <h3>당번표 로그인</h3>
  {% if form.errors %}<div class="msg error" role="alert">아이디 또는 비밀번호가 맞지 않습니다.</div>{% endif %}
  <form method="post">{% csrf_token %}
    <label>아이디 (멤버 코드)<input name="username" autocomplete="username" required autofocus></label>
    <label>비밀번호<input name="password" type="password" autocomplete="current-password" required></label>
    <button>로그인</button>
  </form>
</article>
<style>
  .login-logo { display: block; width: 60%; max-width: 220px; margin: .5rem auto 1.2rem; }
  @media (prefers-color-scheme: dark) { .login-logo { filter: brightness(0) invert(1); } }
</style>
{% endblock %}
