{% extends "duty/base.html" %}
{% block content %}
<div class="cal-nav">
  <a role="button" class="{% if view != 'week' %}outline {% endif %}secondary" href="{{ week_link }}">주간</a>
  <a role="button" class="{% if view != 'month' %}outline {% endif %}secondary" href="{{ month_link }}">월간</a>
  <a role="button" class="outline" href="{{ prev }}">◀ 이전</a>
  <a role="button" class="outline" href="{{ today_link }}">오늘</a>
  <a role="button" class="outline" href="{{ next }}">다음 ▶</a>
  <strong class="cal-title">{{ title }}</strong>
</div>
<form method="get" class="search">
  <input type="hidden" name="view" value="{{ view }}">
  <input type="date" name="date" value="{{ date|date:'Y-m-d' }}" aria-label="이동할 날짜" style="min-width:10rem">
  {% for n in names %}<span class="name"><span class="swatch hl{{ forloop.counter }}"></span><input name="q{{ forloop.counter }}" value="{{ n }}" placeholder="이름 {{ forloop.counter }}" aria-label="이름 {{ forloop.counter }}"></span>
  {% endfor %}
  <button>Today</button>
  <button type="button" class="outline secondary" id="slot-toggle"></button>
</form>
<div class="grid-wrap">
<table class="roster month" id="roster">
  <thead><tr>{% for w in "월화수목금" %}<th>{{ w }}</th>{% endfor %}</tr></thead>
  <tbody>
  {% for week in weeks %}
    <tr>
    {% for d in week %}
      <td{% if d.other %} class="other"{% elif d.is_today %} id="today" class="today-col"{% endif %}>
        {% include "duty/_daycell.html" %}
      </td>
    {% endfor %}
    </tr>
  {% endfor %}
  </tbody>
</table>
</div>
<script>
  const t = document.getElementById("roster"), b = document.getElementById("slot-toggle"), K = "roster.slotsHidden";
  const paint = () => b.textContent = t.classList.contains("slots-hidden") ? "장중 당번 펼치기" : "장중 당번 접기";
  try { t.classList.toggle("slots-hidden", localStorage.getItem(K) === "1"); } catch (e) {}
  paint();
  b.onclick = () => {
    t.classList.toggle("slots-hidden");
    try { localStorage.setItem(K, t.classList.contains("slots-hidden") ? "1" : "0"); } catch (e) {}
    paint();
  };
  const today = document.getElementById("today");
  if (today) {
    today.scrollIntoView({block: "nearest", inline: "center"});
    if (location.hash === "#today") document.querySelectorAll(".today-col").forEach(e => e.classList.add("blink"));
  }
  // 마지막 보기 기억: view 파라미터 없이 들어오면 저장된 보기로 이동
  try {
    const v = new URLSearchParams(location.search).get("view");
    if (v) localStorage.setItem("roster.view", v);
    else if (localStorage.getItem("roster.view") === "month") { const u = new URL(location); u.searchParams.set("view", "month"); location.replace(u); }
  } catch (e) {}
</script>
{% endblock %}
