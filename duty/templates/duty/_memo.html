{% if m or p.memo_admin %}<div class="memo-note{% if m %} filled{% endif %}">{% if p.name %}<b>{{ p.name }} · </b>{% endif %}<small>{% if scope == "week" %}{% if dated %}{{ md|date:"n/j" }} 주 메모:{% else %}주 메모{% endif %}{% else %}{{ md.month }}월 메모{% endif %}</small>{% if m %} <span>{{ m.text|linebreaksbr }}</span>{% endif %}{% if p.memo_admin %} <a class="memo-btn" href="{% url 'memo' scope md %}{{ p.bq }}" hx-get="{% url 'memo' scope md %}?next={{ page_nq }}{{ p.bqa }}" hx-target="#dlg-body">[메모]</a>{% endif %}</div>{% endif %}
