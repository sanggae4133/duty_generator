{% if m or memo_admin %}<div class="memo-note{% if m %} filled{% endif %}"><small>{% if scope == "week" %}{% if dated %}{{ md|date:"n/j" }} 주 메모:{% else %}주 메모{% endif %}{% else %}{{ md.month }}월 메모{% endif %}</small>{% if m %} <span>{{ m.text|linebreaksbr }}</span>{% endif %}{% if memo_admin %} <a class="memo-btn" href="{% url 'memo' scope md %}{{ bq }}" hx-get="{% url 'memo' scope md %}?next={{ request.get_full_path|urlencode }}{{ bqa }}" hx-target="#dlg-body">[메모]</a>{% endif %}</div>{% endif %}
