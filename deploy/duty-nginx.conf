# 당번표 앞단 nginx 의 설정 파일 전체. 서버에서 /etc/nginx/nginx.conf 를 이 파일로 바꿔서 쓴다.
# 넣는 법·바꾸는 법은 docs/OPERATIONS.md "nginx" 절을 그대로 따른다(바꾸기 전에 예전 파일을 남기고, 검사가 실패하면 되돌린다).
#
# 왜 있나: 웹(gunicorn)은 스레드 4개뿐이라, 본문을 아주 느리게 보내는 연결 몇 개로 사이트 전체가 멈춘다.
# nginx 는 연결 수천 개를 적은 메모리로 들고 있다가, 요청을 끝까지 다 받은 뒤에만 gunicorn 에 넘긴다.
#
# 흐름: 인터넷 → Tailscale Funnel(HTTPS) → nginx 127.0.0.1:8008 → gunicorn 127.0.0.1:8090
#
# 왜 nginx.conf 를 통째로 바꾸나: RHEL 패키지의 기본 nginx.conf 는 80 포트 안내 페이지를 모든 주소에 연다.
# 그러면 다른 프로그램이 80 을 쓸 때 nginx 가 안 뜨고, 방화벽이 80 을 열어 두었으면 안내 페이지가 사내망에 보인다.
# 이 파일에는 8008(서버 안) 하나만 있다. 패키지 업데이트는 이 파일을 덮어쓰지 않는다(새 기본값은 nginx.conf.rpmnew 로 생긴다).

# RHEL 패키지 기본값 그대로(nginx 사용자, CPU 수만큼 프로세스, systemd 유닛의 PIDFile 과 같은 pid 경로)
user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log;
pid /run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    # 접근 로그는 끈다: 캘린더 구독 주소(/calendar/<토큰>.ics)에 비밀 토큰이 들어 있다
    access_log off;
    server_tokens off;  # 오류 화면에 nginx 버전을 보이지 않는다
    # 응답 압축: 월간 근무표 HTML 이 약 100KB 라 휴대폰 회선에서 체감된다(text/html 은 기본 포함).
    # CSRF 토큰은 응답마다 바뀌게(마스킹) 나가므로 압축으로 새는 위험(BREACH)이 낮다
    gzip on;
    gzip_proxied any;
    gzip_types text/css application/javascript application/json text/calendar;

    server {
        # 서버 안에서만 연다. 8008 은 SELinux 가 웹 서버에 기본으로 허용하는 포트(http_port_t)라 따로 열 것이 없다
        listen 127.0.0.1:8008;
        server_name _;  # Host 검사는 Django(DUTY_ALLOWED_HOSTS)가 한다

        error_log /var/log/nginx/duty-error.log warn;

        # 느린 연결: nginx 는 요청을 끝까지 받은 뒤에만 gunicorn 에 넘긴다(proxy_request_buffering 기본 on).
        # 그래서 느린 연결은 nginx 만 붙잡고 gunicorn 스레드는 비어 있다. 아래 값은 그런 연결을 정리하는 시간이다:
        # 헤더는 다 받는 데 10초까지, 본문은 10초 동안 한 바이트도 안 오면 끊는다
        client_header_timeout 10s;
        client_body_timeout 10s;
        send_timeout 30s;
        keepalive_timeout 30s;
        # 가장 큰 정상 요청은 출근표 CSV 1MB. 넘으면 413
        client_max_body_size 2m;

        # gunicorn 으로 넘길 때 붙이는 헤더(아래 두 location 이 같이 쓴다).
        # 주의: location 안에 proxy_set_header 를 하나라도 쓰면 여기 것을 전부 안 물려받는다 → location 에는 쓰지 않는다
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # 이 포트에는 Funnel(HTTPS)과 서버 안의 점검만 들어온다 → 항상 https 로 알린다(Django 의 CSRF·보안 쿠키·HSTS 가 이 값을 본다)
        proxy_set_header X-Forwarded-Proto https;
        # 같은 뜻의 다른 헤더는 지운다(Funnel 이 지우지 않아, 바깥에서 엇갈린 값을 보내면 gunicorn 이 400 을 낼 수 있다)
        proxy_set_header X-Forwarded-Ssl "";
        proxy_set_header X-Forwarded-Protocol "";
        proxy_read_timeout 60s;

        location / {
            proxy_pass http://127.0.0.1:8090;
        }

        # 캘린더 피드: nginx 오류 줄에는 요청 줄(토큰이 든 경로)이 붙는다 → 이 경로의 오류 로그는 아예 버린다
        location /calendar/ {
            error_log /dev/null;
            proxy_pass http://127.0.0.1:8090;
        }
    }
}
